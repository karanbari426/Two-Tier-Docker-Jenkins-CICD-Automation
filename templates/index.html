<!DOCTYPE html>
<html>
<head>
    <title>Hospital Staff Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 40px;
        }

        h1 {
            color: #1f2937;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .edit {
            color: #2563eb;
        }

        .delete {
            color: red;
        }
    </style>
</head>

<body>

<h1>🏥 Hospital Staff Management</h1>

<a class="btn" href="/add">+ Add Staff</a>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Role</th>
        <th>Department</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
    </tr>

    {% for person in staff %}

    <tr>

        <td>{{ person.id }}</td>
        <td>{{ person.name }}</td>
        <td>{{ person.role }}</td>
        <td>{{ person.department }}</td>
        <td>{{ person.email }}</td>
        <td>{{ person.phone }}</td>

        <td>
            <a class="edit"
               href="/edit/{{ person.id }}">
               Edit
            </a>

            |

            <a class="delete"
               href="/delete/{{ person.id }}"
               onclick="return confirm('Delete this staff member?')">
               Delete
            </a>
        </td>

    </tr>

    {% endfor %}

</table>

</body>
</html>
